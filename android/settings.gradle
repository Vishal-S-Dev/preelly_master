import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()
    maven { url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo") }
    // Required by @notifee/react-native — its `app.notifee:core` artifact only exists in this
    // bundled local repo, not on Maven Central/Google. Gradle 9's PREFER_SETTINGS repositories
    // mode (above) ignores the equivalent `allprojects{}` repo notifee's own build.gradle adds,
    // so it must be declared centrally here instead.
    maven { url("$rootDir/../node_modules/@notifee/react-native/android/libs") }
  }
}

rootProject.name = 'Preelly'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
